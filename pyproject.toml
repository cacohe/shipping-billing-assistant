[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shipping-billing-assistant"
version = "0.1.0"
description = "AI-assisted shipping billing document processing and reconciliation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "langchain-core>=0.3,<2",
  "langchain-litellm>=0.3,<1",
  "litellm>=1.70,<2",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "pypdf>=6.0,<7",
  "pycountry>=24.6,<27",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.2,<2",
  "qiniu>=7.14,<8",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
demo = [
  "streamlit>=1.40,<2",
]
dev = [
  "mypy>=1.14,<2",
  "pillow>=11,<13",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/domain", "src/application", "src/adapters", "src/bootstrap"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["domain", "application", "adapters", "bootstrap"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pycountry", "docx", "openpyxl.*", "xlrd", "langchain_litellm", "qiniu", "streamlit", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: tests that cross a concrete adapter or complete application flow",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

